<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Art Work</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Centering Layout Wrapper -->
  <div class="page-wrapper">
    <!-- Main Art Work Showcase Board (position: relative) -->
    <main class="gallery-container">
      <!-- Frame Registration / Ambient Accent Dots (position: absolute) -->
      <span class="frame-dot dot-tl" aria-hidden="true"></span>
      <span class="frame-dot dot-tr" aria-hidden="true"></span>
      <span class="frame-dot dot-ml" aria-hidden="true"></span>
      <span class="frame-dot dot-mr" aria-hidden="true"></span>
      <span class="frame-dot dot-bl" aria-hidden="true"></span>
      <span class="frame-dot dot-br" aria-hidden="true"></span>

      <!-- Header Section (display: flex) -->
      <header class="gallery-header">
        <h1 class="gallery-title">Explore Art Work</h1>
        <a href="#see-all" class="see-all-link">See All</a>
      </header>

      <!-- 8-Card Showcase Grid (display: flex) -->
      <section class="cards-grid">
        <!-- Card 1: Monocular -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/monocular.png" alt="Monocular Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Monocular</h2>
            <div class="art-likes">
              <span class="like-count">54.8k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 2: Horns Mask -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/horns-mask.png" alt="Horns Mask Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Horns Mask</h2>
            <div class="art-likes">
              <span class="like-count">32.4k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 3: Light Moon -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/light-moon.png" alt="Light Moon Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Light Moon</h2>
            <div class="art-likes">
              <span class="like-count">86.6k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 4: Skull Wire -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/skull-wire.png" alt="Skull Wire Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Skull Wire</h2>
            <div class="art-likes">
              <span class="like-count">78.9k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 5: Spiderman -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/spiderman.png" alt="Spiderman Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Spiderman</h2>
            <div class="art-likes">
              <span class="like-count">24.8k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 6: DeadPool -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/deadpool.png" alt="DeadPool Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">DeadPool</h2>
            <div class="art-likes">
              <span class="like-count">59.7k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 7: White Eye -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/white-eye.png" alt="White Eye Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">White Eye</h2>
            <div class="art-likes">
              <span class="like-count">45.7k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <!-- Card 8: Plastic Spinal -->
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/plastic-spinal.png" alt="Plastic Spinal Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Plastic Spinal</h2>
            <div class="art-likes">
              <span class="like-count">98.6k</span>
              <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Like artwork">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
