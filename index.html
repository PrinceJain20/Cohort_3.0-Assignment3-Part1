<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Art Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="gallery-container">
      <header class="gallery-header">
        <h1 class="gallery-title">Explore Art Work</h1>
        <a href="#see-all" class="see-all-link">See All</a>
      </header>

      <section class="cards-grid">
        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/monocular.png" alt="Monocular Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Monocular</h2>
            <div class="art-likes">
              <span class="like-count">54.8k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/horns-mask.png" alt="Horns Mask Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Horns Mask</h2>
            <div class="art-likes">
              <span class="like-count">32.4k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/light-moon.png" alt="Light Moon Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Light Moon</h2>
            <div class="art-likes">
              <span class="like-count">86.6k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/skull-wire.png" alt="Skull Wire Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Skull Wire</h2>
            <div class="art-likes">
              <span class="like-count">78.9k</span> 
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/spiderman.png" alt="Spiderman Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Spiderman</h2>
            <div class="art-likes">
              <span class="like-count">24.8k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/deadpool.png" alt="DeadPool Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">DeadPool</h2>
            <div class="art-likes">
              <span class="like-count">59.7k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/white-eye.png" alt="White Eye Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">White Eye</h2>
            <div class="art-likes">
              <span class="like-count">45.7k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>

        <article class="art-card">
          <div class="card-image-wrap">
            <img src="images/plastic-spinal.png" alt="Plastic Spinal Artwork" class="art-image">
          </div>
          <div class="card-info">
            <h2 class="art-title">Plastic Spinal</h2>
            <div class="art-likes">
              <span class="like-count">98.6k</span>
            </div>
          </div>
          <button class="bid-btn" type="button">Place Bid</button>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
